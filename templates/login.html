{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Welcome Back</h2>
        <p class="text-muted">Login to your account to continue</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
            <!-- Tabs -->
            <ul class="nav nav-pills nav-fill mb-4" id="loginTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill" id="customer-tab" data-bs-toggle="pill" data-bs-target="#customer-login" type="button" role="tab" aria-controls="customer-login" aria-selected="true">Customer Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill" id="owner-tab" data-bs-toggle="pill" data-bs-target="#owner-login" type="button" role="tab" aria-controls="owner-login" aria-selected="false">Shop Owner Login</button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="loginTabsContent">
                
                <!-- Customer Login Tab -->
                <div class="tab-pane fade show active" id="customer-login" role="tabpanel" aria-labelledby="customer-tab">
                    <form action="/login" method="POST">
                        <input type="hidden" name="role" value="customer">
                        <div class="mb-3">
                            <label for="customerEmail" class="form-label text-muted small fw-bold">Email address</label>
                            <input type="email" class="form-control form-control-lg bg-light" id="customerEmail" name="email" required>
                        </div>
                        <div class="mb-4">
                            <label for="customerPassword" class="form-label text-muted small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg bg-light border-end-0" id="customerPassword" name="password" required>
                                <button class="btn btn-light border border-start-0" type="button" onclick="togglePassword('customerPassword')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Login</button>
                        </div>
                        <div class="text-center d-flex justify-content-between small">
                            <a href="#" class="text-decoration-none text-muted">Forgot password?</a>
                            <a href="/register?tab=customer" class="text-decoration-none fw-bold">Don't have an account?</a>
                        </div>
                    </form>
                </div>

                <!-- Owner Login Tab -->
                <div class="tab-pane fade" id="owner-login" role="tabpanel" aria-labelledby="owner-tab">
                    <form action="/login" method="POST">
                        <input type="hidden" name="role" value="owner">
                        <div class="mb-3">
                            <label for="ownerEmail" class="form-label text-muted small fw-bold">Email address</label>
                            <input type="email" class="form-control form-control-lg bg-light" id="ownerEmail" name="email" required>
                        </div>
                        <div class="mb-4">
                            <label for="ownerPassword" class="form-label text-muted small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg bg-light border-end-0" id="ownerPassword" name="password" required>
                                <button class="btn btn-light border border-start-0" type="button" onclick="togglePassword('ownerPassword')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Login as Owner</button>
                        </div>
                        <div class="text-center d-flex justify-content-between small">
                            <a href="#" class="text-decoration-none text-muted">Forgot password?</a>
                            <a href="/register?tab=owner" class="text-decoration-none fw-bold">Register your shop</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = input.nextElementSibling.querySelector('i');
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = "password";
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
